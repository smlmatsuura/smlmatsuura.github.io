<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d9e">
<title>現場計算</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1e21;--sub:#6b7280;--ln:#e5e7eb;--ac:#2f5d9e;--wn:#c2410c;--ok:#15803d;--hd:#e9ecf1;--am:#fff4d6;--amt:#7a5200;--k:#2f6fcf;--u:#d9730d;--c:#1f9d55;--kb:#e4eefc;--ub:#fdecd8;--cb:#dff3e7;--rb:#fde8e8;--rt:#9b1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1c1e22;--tx:#eceef1;--sub:#9aa1ad;--ln:#2d3038;--ac:#6c9be0;--wn:#fb923c;--ok:#4ade80;--hd:#25282e;--am:#3a2f12;--amt:#f5d58a;--k:#6ea2f0;--u:#f59e42;--c:#4ade80;--kb:#1b2a44;--ub:#3a2a14;--cb:#14301f;--rb:#3a1a1a;--rt:#f5a3a3}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
input,button,select,textarea{font:inherit;color:var(--tx)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;z-index:5}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}.row input{width:100%;min-width:0}
select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--card)}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
label input,label textarea{margin-top:3px;font-size:15px;color:var(--tx)}
.btn{padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card);flex:none;width:auto}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);margin:10px 12px;padding:12px;border-radius:12px;border:1px solid var(--ln)}
.dh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.dh input{width:150px;flex:none}
.sub{color:var(--sub);font-size:12px;flex:1}
.del{border:none;background:none;color:var(--wn);font-size:13px;width:auto;padding:4px}
.memo textarea{border-color:transparent}
.memo.ns textarea{background:var(--rb);color:var(--rt)}
.memo.kt textarea{background:var(--am);color:var(--amt)}
.memo.ns{color:var(--rt)}
.memo.kt{color:var(--amt)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:18px;border:2px solid var(--rc,var(--ln));background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.k{--rc:var(--k)}.chip.u{--rc:var(--u)}.chip.c{--rc:var(--c)}
.chip.on{background:var(--rc);color:#fff;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block;flex:none}
.lg{display:flex;gap:14px;margin:10px 14px 0;font-size:13px;color:var(--sub)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg .dot{border:none}
.card.day{border-left:5px solid var(--ac)}
.card>b:first-child{color:var(--ac)}
.bal.n{background:var(--rb);border-color:transparent}
.bal.p{background:var(--cb);border-color:transparent}
.rt{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;color:#fff;margin-left:6px}
.rt.k{background:var(--k)}.rt.u{background:var(--u)}.rt.c{background:var(--c)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;padding:14px 0;border:none;background:none;font-size:14px;color:var(--sub)}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.big{font-size:26px;font-weight:700}
.neg{color:var(--wn)}.pos{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--hd);color:var(--sub);font-weight:600}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:right}
th:first-child,td:first-child{text-align:left}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);font-size:14px}
.pgw{margin:10px 12px;overflow:hidden;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff}
.pg{width:794px;min-height:1123px;box-sizing:border-box;padding:34px 36px;background:#fff;color:#111;transform-origin:0 0}
.pw{margin:0 0 16px}
.pt{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;color:#111;font-size:11px}
.pt td{border:1px solid #9aa5b4;padding:2px 3px;text-align:center;vertical-align:top;overflow:hidden;word-break:break-all}
.pt td.lb{width:56px;white-space:nowrap;font-size:10px;padding:2px 0;vertical-align:middle;background:#e8edf5;font-weight:700;color:#334155}
.pt td.dd{background:#f4f6fa;font-weight:600;vertical-align:middle;height:30px;border-bottom:1.5px solid #475569}
.pt td.t{white-space:pre-wrap;text-align:left}
.pt td.c1{height:30px;vertical-align:middle}
.h1{height:44px}.h2{height:76px}
.pt td.mem{padding:0}
.pt td.mem div{height:16px;line-height:16px;border-bottom:1px dotted #c5ccd6;font-size:10.5px}
.pmemo{margin-top:12px;border:1px solid #9aa5b4;height:74px;box-sizing:border-box;padding:4px 8px;font-size:11px;line-height:16px;white-space:pre-wrap;overflow:hidden;text-align:left;color:#111}.pmemo b{display:block;font-size:10px;color:#5b6676;line-height:12px}
.ptm{margin-left:auto;font-size:11px;font-weight:400;color:#333;text-align:right;line-height:14px;max-width:60%}
.ptt{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:17px;color:#111;margin:0 0 12px;padding:0 0 8px;border-bottom:3px solid #4472c4;text-align:left}
#hr{align-items:center}
.ttl{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj{cursor:pointer;border-left:5px solid var(--ac)}
.pn{font-size:17px;font-weight:700;margin-bottom:3px}
.pb{font-weight:700;margin-top:6px}
html,body{overflow-x:hidden}
.vr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}
.vr>span{flex:1;min-width:0}
.vr input{width:120px;flex:none;text-align:right;margin:0}
.vr input{min-width:0;max-width:45%}.vr input.nm{width:auto;flex:1;max-width:none;text-align:left}
.vr .xd{flex:none;width:38px;padding:6px 0;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--wn);font-size:15px}
.vr .xd.arm{width:auto;padding:6px 8px;background:var(--wn);color:#fff;border-color:var(--wn);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tw{overflow-x:auto}
.tw table{font-size:11px;width:100%}.tw td,.tw th{padding:5px 2px}.tw td:first-child{white-space:normal;line-height:1.3}.tw .rt{font-size:9px;padding:0 5px;margin:1px 0 0}
.tw td,.tw th{white-space:nowrap}
.tw tr.tt td{font-weight:700;border-top:2px solid var(--ln)}
.gh{display:flex;justify-content:space-between;align-items:center;margin:16px 14px 6px;font-weight:700;font-size:15px;cursor:pointer}
.emp{text-align:center;color:var(--sub);padding:30px 14px;line-height:1.7}
#login{display:none;text-align:center;padding:80px 24px}
#login p{color:var(--sub);line-height:1.6}
</style>
</head>
<body>
<div id="login"><h1>現場計算</h1><p>Microsoftアカウントでログインしてください。</p>
<button class="btn p" id="lg" style="padding:14px 26px;font-size:16px">Microsoftでログイン</button><p id="lerr" style="color:var(--wn);font-size:13px"></p></div>
<div id="app" style="display:none">
<header><div class="row" id="hr"></div>
<div class="sub" id="st" style="margin-top:4px"></div></header>
<main id="main"></main>
<nav><button data-tab="i">案件</button><button data-tab="d">日程</button><button data-tab="x">経費</button><button data-tab="r">結果</button><button data-tab="p">印刷</button><button data-tab="w">職人</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
var CLIENT_ID="7806d507-6cf4-49ad-b426-30b64e18879c",SC=["Files.ReadWrite.AppFolder"];
var URL_F="https://graph.microsoft.com/v1.0/me/drive/special/approot:/hotel.json:/content";
var all=[],tab="d",pid=null,view="list",busy=false,timer=null,pca=null,armed=null;
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yen(n){return Math.round(n).toLocaleString("ja-JP")}
function K(k){return all.filter(function(i){return i.k===k&&!i.x})}
function find(id){return all.filter(function(i){return i.id===id})[0]}
function touch(it){it.t=Date.now()}
function rate(p,w){var q=(p.pw&&p.pw[w.id])||{};return{r:q.r!=null?q.r:(w.r||0),m:q.m!=null?q.m:(w.m||0),e:q.e!=null?q.e:(w.e||0),o:q.o!=null?q.o:(w.o||0)}}
function uid(){return"x"+Date.now().toString(36)+Math.floor(Math.random()*1e4)}
function add(o){o.id=uid();o.t=Date.now();all.push(o);return o}
var PAL=["F4A6A0","F7B77A","F5D96B","A8D98A","6FCFB0","7CC4EC","8FA8F0","B79CEB","E39BD0","D4B08C","C3D86B","F08FA8","9DB4C0","E8A87C","8CCFD4","C9A0DC","B5C99A","F2B8C6"];
function wcol(w){if(w.col&&/^#?[0-9a-fA-F]{6}$/.test(w.col))return"#"+w.col.replace("#","");var i=K("w").sort(bys).indexOf(w);return"#"+PAL[(i<0?0:i)%PAL.length]}
var RN={k:"職人",u:"受け元",c:"掃除"};
function role(w){return w.role||(w.c?"c":"k")}
function cn(m,ws){var a=0,u=0,c=0;ws.forEach(function(w){if(m.indexOf(w.id)<0)return;var r=role(w);if(r==="c")c++;else if(r==="u")u++;else a++});return(u?"受け元"+u+"・":"")+"職人"+a+(c?"・掃除"+c:"")+"　計"+(a+u+c)+"名"}
function bys(a,b){return(a.s||0)-(b.s||0)}
function merge(a,b){var m={};a.concat(b).forEach(function(i){var c=m[i.id];if(!c||(i.t||0)>(c.t||0))m[i.id]=i});return Object.keys(m).map(function(k){return m[k]})}
var cpk=0;function colSet(t){var it=find(t.dataset.id);if(!it)return;cpk=Date.now();it.col=t.value.replace("#","");touch(it);var cd=t.closest(".card");if(cd)cd.style.borderLeftColor=t.value;push()}
document.addEventListener("input",function(e){var t=e.target;if(t&&t.type==="color"&&t.dataset&&t.dataset.f==="col")colSet(t)});
function typing(){if(Date.now()-cpk<5000)return true;var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.closest("#main")}
function status(m){$("st").textContent=m}
function token(){var acc=pca.getActiveAccount();return pca.acquireTokenSilent({scopes:SC,account:acc}).then(function(r){return r.accessToken}).catch(function(){pca.acquireTokenRedirect({scopes:SC});return new Promise(function(){})})}
function gr(m,b){return token().then(function(t){var h={Authorization:"Bearer "+t};if(b)h["Content-Type"]="application/json";return fetch(URL_F,{method:m,headers:h,body:b})})}
function load(){return gr("GET").then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("load "+r.status);return r.json()})}
function push(){clearTimeout(timer);status("同期待ち…");timer=setTimeout(doSync,600)}
function doSync(){if(busy){timer=setTimeout(doSync,500);return}busy=true;status("同期中…");
load().then(function(r){all=merge(all,(r&&r.items)||[]);return gr("PUT",JSON.stringify({v:1,items:all}))})
.then(function(r){if(!r.ok)throw new Error("save "+r.status);status("同期済み");busy=false;if(!typing())render()})
.catch(function(){busy=false;status("同期失敗：再試行中");setTimeout(push,5000)})}
function pull(force){if(busy||(!force&&(document.hidden||typing())))return;busy=true;if(force)status("更新中…");
load().then(function(r){busy=false;if(r){var b=JSON.stringify(all);all=merge(all,r.items||[]);if(force||JSON.stringify(all)!==b){if(!typing())render()}}status("同期済み")}).catch(function(){busy=false;status("オフライン")})}
function curP(){return K("p").filter(function(x){return x.id===pid})[0]||null}
function dfmt(dt){var d=new Date(dt+"T00:00:00");return(d.getMonth()+1)+"/"+d.getDate()+"（"+"日月火水木金土"[d.getDay()]+"）"}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function calc(p){var ds=K("d").filter(function(d){return d.p===p.id}).sort(function(a,b){return a.dt<b.dt?-1:a.dt>b.dt?1:0}),cnt={},cars=0,tot=0;
ds.forEach(function(d){cars+=+d.cnt||0;(d.m||[]).forEach(function(w){cnt[w]=(cnt[w]||0)+1;tot++})});
var rows=[],lab=0,cl=0,lu=0,nk=0,nu=0,nc=0,mv=0,ex=0,ot=0;
K("w").sort(bys).forEach(function(w){var c=cnt[w.id]||0;if(!c)return;var q=rate(p,w),wg=role(w)==="u"?0:c*q.r,m=q.m,e=q.e,o=q.o;rows.push({w:w,c:c,wg:wg,m:m,e:e,o:o,sum:wg+m+e+o});var ro=role(w);if(ro==="c"){cl+=wg;nc+=c}else if(ro==="u"){lu+=wg;nu+=c}else{lab+=wg;nk+=c}mv+=m;ex+=e;ot+=o});
var gas=p.ef>0?(p.km||0)/p.ef*(p.gp||0):0,hotel=(p.hn||0)*(p.hp||0)*(p.hd||0),ex2=xs(p).reduce(function(a,x){return a+(+x.a||0)},0),oth=ex2+hotel,total=lab+cl+mv+ex+ot+oth;
return{ds:ds,cars:cars,tot:tot,rows:rows,lab:lab,cl:cl,lu:lu,nk:nk,nu:nu,nc:nc,mv:mv,ex:ex,ot:ot,gas:gas,hotel:hotel,ex2:ex2,oth:oth,total:total,bal:(p.v||0)-total,hint:Math.ceil(((p.hw||0)+gas)/1000)*1000}}
function xs(p){return p.xs||[{n:"駐車場",a:p.pk||0},{n:"食事",a:p.ml||0},{n:"飲み物等",a:p.dr||0},{n:"エスカ",a:p.es||0},{n:"材料1",a:p.m1||0},{n:"材料2",a:p.m2||0},{n:"材料3",a:p.m3||0}]}
function setXs(p,fn){var a=xs(p).map(function(x){return{n:x.n,a:x.a}});fn(a);p.xs=a;touch(p)}
function vr(l,id,f,v){return'<div class="vr"><span>'+l+'</span><input type="number" inputmode="decimal" step="any" data-id="'+id+'" data-f="'+f+'" data-n="1" value="'+(v==null?"":v)+'"></div>'}
function num(l,id,f,v){return'<label>'+l+'<input type="number" inputmode="decimal" step="any" data-id="'+id+'" data-f="'+f+'" data-n="1" value="'+(v==null?"":v)+'"></label>'}
function txt(l,id,f,v,cls){return'<label>'+l+'<input data-id="'+id+'" data-f="'+f+'" value="'+esc(v)+'"></label>'}
function dbtn(id){return'<button class="del" data-del="'+id+'">'+(armed===id?"もう一度押して削除":"削除")+'</button>'}
function vDays(p){var c=calc(p),ws=K("w").sort(bys),h="";
if(!ws.length)h+='<div class="emp">先に「職人」タブで職人を登録してください。</div>';

c.ds.forEach(function(d){var m=d.m||[],wd=new Date(d.dt+"T00:00:00").getDay();
h+='<div class="card day"><div class="dh"><input type="date" data-id="'+d.id+'" data-f="dt" value="'+esc(d.dt)+'"><b style="color:'+(wd===0?"#d33":wd===6?"#2f6fcf":"inherit")+'">'+dfmt(d.dt).slice(-3)+'</b><span class="sub">'+cn(m,ws)+'</span>'+dbtn(d.id)+'</div>'+
'<div class="row">'+txt("作業箇所",d.id,"loc",d.loc)+num("台数",d.id,"cnt",d.cnt)+'</div>'+
'<label class="memo ns">売り止め<textarea rows="2" data-id="'+d.id+'" data-f="ns">'+esc(d.ns)+'</textarea></label>'+
'<label class="memo kt">勝手<textarea rows="2" data-id="'+d.id+'" data-f="kt">'+esc(d.kt)+'</textarea></label>'+
'<div class="chips">'+ws.map(function(w){return'<button class="chip '+role(w)+(m.indexOf(w.id)>=0?" on":"")+'" data-tg="'+d.id+'" data-w="'+w.id+'">'+esc(w.n)+'</button>'}).join("")+'</div></div>'});
return h+'<div style="margin:12px"><button class="btn p" style="width:100%" id="ad">＋ 日を追加</button></div>'}
function wcard(p,c){if(!c.rows.length)return"";return'<div class="sub" style="margin:10px 14px 0">この案件の金額です。日程で選んだ人だけ表示されます。</div>'+c.rows.map(function(r){var q=rate(p,r.w),id=r.w.id;function f(l,k){return'<label>'+l+'<input type="number" inputmode="decimal" step="any" data-pw="'+id+'" data-pf="'+k+'" value="'+q[k]+'"></label>'}return'<div class="card" style="border-left:10px solid '+wcol(r.w)+'"><div class="dh"><b>'+esc(r.w.n)+'</b><span class="rt '+role(r.w)+'">'+RN[role(r.w)]+'</span><span class="sub">'+r.c+'人工</span></div><div class="g2" style="margin-top:4px">'+(role(r.w)==="u"?"":f("日当","r"))+f("移動費","m")+f("諸経費","e")+f("その他","o")+'</div></div>'}).join("")}
function vPW(p){var c=calc(p);if(!c.rows.length)return'<div class="emp">「日程」で人を選ぶと、ここにその案件の金額が出ます。</div>';return wcard(p,c)+'<div class="sub" style="margin:10px 14px">名前・区分・色の変更や、人の追加は、案件一覧の「職人の登録・編集」から行います。ここの金額は、この案件だけに反映されます。</div>'}
function vCost(p){var c=calc(p),xl=xs(p);
var xr=xl.map(function(x,i){return'<div class="vr"><input class="nm" data-xi="'+i+'" data-xf="n" value="'+esc(x.n)+'"><input type="number" inputmode="decimal" step="any" data-xi="'+i+'" data-xf="a" value="'+(x.a==null?"":x.a)+'" style="width:110px"></div>'}).join("");
return ''+
'<div class="card"><b>移動費まわり</b><div class="row" style="margin-top:8px">'+num("高速代",p.id,"hw",p.hw)+'</div><div class="row">'+num("距離(km)",p.id,"km",p.km)+num("燃費(km/L)",p.id,"ef",p.ef)+num("ガソリン単価",p.id,"gp",p.gp)+'</div>'+
'<div class="kv"><span>ガソリン代（計算）</span><span>'+yen(c.gas)+'円</span></div><div class="kv"><span>移動費の目安（千円切上）</span><span>'+yen(c.hint)+'円</span></div><div class="sub" style="margin-top:6px">目安は、高速代とガソリン代の合計を千円単位に切り上げた金額です。受け元の「移動費」に入れる金額の参考にしてください。</div></div>'+
'<div class="card"><b>宿泊</b><div class="row" style="margin-top:8px">'+num("1泊単価",p.id,"hn",p.hn)+num("人数",p.id,"hp",p.hp)+num("泊数",p.id,"hd",p.hd)+'</div>'+'<div class="kv"><span>宿泊費（計算）</span><span>'+yen(c.hotel)+'円</span></div></div>'+
'<div class="card"><b>その他の経費</b><div class="sub" style="margin:4px 0 6px">項目名は書き換えられます。使わない項目は金額を空のままにしてください。</div>'+xr+'<div class="kv"><span>その他の経費 合計</span><span>'+yen(c.ex2)+'円</span></div><button class="btn" data-xa="1" style="width:100%;margin-top:8px">＋ 項目を追加</button></div>'}
