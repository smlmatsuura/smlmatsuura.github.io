<html lang="ja">
<head> <link rel="apple-touch-icon" href="icon_futo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="封筒印刷">
<title>封筒印刷（長形3号）</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#1c1c1c;--sub:#777;--line:#e2e2de;--acc:#1f5f8b;--danger:#b23b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:19px;margin:0;flex:1}
h1 small{font-size:12px;color:var(--sub);font-weight:normal;margin-left:6px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.dan{color:var(--danger)}
button:disabled{opacity:.4}
.search{display:flex;gap:6px;margin-top:8px}
.search input{flex:1;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 10px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.idx{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.idx button{padding:4px 0;min-width:34px;font-size:14px;border-radius:8px}
.idx button.off{opacity:.3}
main{padding:6px 12px 120px}
.gh{font-size:13px;color:var(--sub);margin:14px 4px 4px;font-weight:bold}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.item .t{flex:1;min-width:0}
.item .c{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item input[type=checkbox]{width:22px;height:22px}
.empty{text-align:center;color:var(--sub);margin-top:40px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;z-index:20}
.bar button{flex:1;padding:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px)}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ptitle b{flex:1;font-size:17px}
.prev{background:#fff;border:1px solid var(--line);border-radius:6px;width:100%;display:block;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 2px 4px}
.f input,.f textarea,.f select{width:100%;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
.f textarea{resize:vertical;min-height:44px}
.two{display:flex;gap:8px}.two>div{flex:1}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:12px}
.note{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login p{color:var(--sub);line-height:1.6}
#login h1{flex:none;font-size:24px;margin-bottom:6px}
#st{font-size:12px;color:var(--sub);margin-top:4px}
#printArea{display:none}
@page{size:120mm 235mm;margin:0}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff;margin:0}
  #printArea{display:block}
  #printArea img{display:block;width:120mm;height:235mm;page-break-after:always;break-after:page}
  #printArea img:last-child{page-break-after:auto;break-after:auto}
}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
.toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>封筒印刷<small>長形3号</small></h1>
    <button id="bSel">選択</button>
    <button id="bSet">⚙</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="検索（会社・名前・住所）">
    <div class="seg"><button data-s="co" class="on">会社</button><button data-s="nm">名前</button></div>
  </div>
  <div class="idx" id="idx"></div>
  <div id="st"></div>
</header>
<main id="list"></main>
<div class="bar" id="bar">
  <button class="pri" id="bAdd">＋ 新しい宛先</button>
</div>

<!-- 詳細 -->
<div class="sheet" id="shView"><div class="panel">
  <div class="ptitle"><b id="vTitle"></b><button id="vClose">閉じる</button></div>
  <canvas class="prev" id="vCan"></canvas>
  <div class="btns"><button class="pri" id="vPrint">印刷</button></div>
  <div class="btns"><button id="vEdit">編集</button><button id="vDup">複製</button><button class="dan" id="vDel">削除</button></div>
</div></div>

<!-- 編集 -->
<div class="sheet" id="shEdit"><div class="panel f">
  <div class="ptitle"><b id="eTitle">宛先</b><button id="eCancel">やめる</button></div>
  <canvas class="prev" id="eCan"></canvas>
  <div class="two">
    <div><label>郵便番号</label><input id="e_zip" inputmode="numeric" placeholder="541-0051"></div>
    <div style="flex:0 0 auto"><label>&nbsp;</label><button id="eZip" type="button">住所を検索</button></div>
  </div>
  <label>住所</label><input id="e_addr1" placeholder="大阪府大阪市中央区…">
  <label>建物名・階</label><input id="e_addr2" placeholder="○○ビル3階">
  <label>会社名</label><input id="e_company">
  <label>会社名のよみ（並び順に使います・ひらがな）</label><input id="e_companyKana" placeholder="おおばやしふぁしりてぃーず">
  <label>部署（改行で2行にできます）</label><textarea id="e_dept" rows="2"></textarea>
  <div class="two">
    <div><label>氏名</label><input id="e_name" placeholder="山田　太郎"></div>
    <div style="flex:0 0 88px"><label>敬称</label><select id="e_honor"><option>様</option><option>御中</option><option>殿</option><option value="">なし</option></select></div>
  </div>
  <label>氏名のよみ</label><input id="e_nameKana" placeholder="やまだ たろう">
  <label>メモ（印刷されません）</label><input id="e_memo">
  <div class="note">氏名が空で敬称が「様」のときは、自動で会社名（部署）に「御中」を付けます。</div>
  <div class="btns"><button class="pri" id="eSave">保存</button></div>
</div></div>

<!-- 設定 -->
<div class="sheet" id="shSet"><div class="panel f">
  <div class="ptitle"><b>設定</b><button id="sClose">閉じる</button></div>
  <label>差出人（1行目は大きめ）</label>
  <textarea id="s_from" rows="4"></textarea>
  <div class="two">
    <div><label>位置調整 左右（mm・＋で右）</label><input id="s_dx" type="number" step="0.5"></div>
    <div><label>位置調整 上下（mm・＋で下）</label><input id="s_dy" type="number" step="0.5"></div>
  </div>
  <label><input type="checkbox" id="s_flip" style="width:auto"> 印刷の向きを逆にする（上下さかさまに出るとき）</label>
  <div class="note">上下左右は封筒を横向き（宛名が読める向き）にしたときの方向です。</div>
  <div class="btns"><button class="pri" id="sSave">設定を保存</button></div>
  <label style="margin-top:22px">バックアップ（全 <span id="sCount"></span> 件）</label>
  <div class="btns" style="margin-top:4px"><button id="sExport">書き出し</button><button id="sImport">読み込み</button></div>
  <input type="file" id="sFile" accept=".json,application/json" style="display:none">
  <div class="note">ログインしていれば、宛先はOneDriveで自動的にiPadと同じになります。書き出しは念のための控えです。</div>
  <div class="btns" style="margin-top:18px"><button id="sLogin"></button></div>
</div></div>

<!-- PDF完成 -->
<div class="sheet" id="shPdf"><div class="panel">
  <div class="ptitle"><b id="pTitle">PDFができました</b><button id="pClose">閉じる</button></div>
  <div class="note" id="pNote"></div>
  <div class="btns"><button class="pri" id="pShare">共有・印刷</button><button id="pOpen">開く</button></div>
</div></div>

<div id="login"><h1>封筒印刷</h1><p>Microsoftアカウントでログインしてください。<br>宛先がOneDriveに保存され、iPadと共有できます。</p>
<button class="pri" id="lg" style="padding:14px 26px;font-size:16px">Microsoftでログイン</button>
<button id="lgSkip" style="margin-top:14px;border:0;background:none;color:var(--sub);font-size:14px">ログインせずに使う（この端末だけに保存）</button>
<p id="lerr" style="color:var(--danger);font-size:13px"></p></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

// ===== 保存・OneDrive同期（ホテル計算アプリと同じ仕組み） =====
const KEY="futo_v2", SKEY="futo_set_v1";
const CLIENT_ID="7806d507-6cf4-49ad-b426-30b64e18879c", SC=["Files.ReadWrite.AppFolder"];
const URL_F="https://graph.microsoft.com/v1.0/me/drive/special/approot:/futo.json:/content";
let data=[], set={...DEF_SET}, pca=null, online=false, busy=false, timer=null;
function live(){return data.filter(r=>!r.x)}
function touch(r){r.t=Date.now()}
function seed(){const now=Date.now();data=SEED.map(r=>({...r,t:now}))}
function loadLocal(){
  try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
  try{set={...DEF_SET,...JSON.parse(localStorage.getItem(SKEY)||"{}")}}catch(e){}
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function save(){saveLocal();push()}
function status(m){$("st").textContent=m}
function merge(a,b){const m={};a.concat(b).forEach(i=>{const c=m[i.id];if(!c||(i.t||0)>(c.t||0))m[i.id]=i});return Object.values(m)}
function token(){const acc=pca.getActiveAccount();return pca.acquireTokenSilent({scopes:SC,account:acc}).then(r=>r.accessToken).catch(()=>{pca.acquireTokenRedirect({scopes:SC});return new Promise(()=>{})})}
function gr(m,b){return token().then(t=>{const h={Authorization:"Bearer "+t};if(b)h["Content-Type"]="application/json";return fetch(URL_F,{method:m,headers:h,body:b})})}
function remote(){return gr("GET").then(r=>{if(r.status===404)return null;if(!r.ok)throw new Error("load "+r.status);return r.json()})}
function push(){if(!online)return;clearTimeout(timer);status("同期待ち…");timer=setTimeout(doSync,600)}
function doSync(){if(busy){timer=setTimeout(doSync,500);return}busy=true;status("同期中…");
  remote().then(r=>{data=merge(data,(r&&r.items)||[]);saveLocal();return gr("PUT",JSON.stringify({v:1,items:data}))})
  .then(r=>{if(!r.ok)throw new Error("save "+r.status);busy=false;status("OneDriveと同期済み");renderList()})
  .catch(()=>{busy=false;status("同期失敗：再試行中");setTimeout(push,5000)})}
function pull(){if(!online||busy||document.hidden)return;busy=true;
  remote().then(r=>{busy=false;if(r){const b=JSON.stringify(data);data=merge(data,r.items||[]);if(JSON.stringify(data)!==b){saveLocal();renderList()}}status("OneDriveと同期済み")})
  .catch(()=>{busy=false;status("オフライン（この端末に保存中）")})}
function startSync(){
  $("login").style.display="none";online=true;status("読み込み中…");
  remote().then(r=>{data=merge(data,(r&&r.items)||[]);
    if(!data.length)seed();
    saveLocal();renderList();
    if(!r||JSON.stringify(r.items||[])!==JSON.stringify(data))push();else status("OneDriveと同期済み");
    setInterval(pull,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
  }).catch(e=>status("読み込み失敗："+e.message))
}
function startLocal(){$("login").style.display="none";if(!data.length){seed();saveLocal()}status("この端末だけに保存中（⚙からログインできます）");renderList()}

const ROWS=[["あ","あいうえおぁぃぅぇぉゔ"],["か","かきくけこがぎぐげご"],["さ","さしすせそざじずぜぞ"],["た","たちつてとだぢづでどっ"],["な","なにぬねの"],["は","はひふへほばびぶべぼぱぴぷぺぽ"],["ま","まみむめも"],["や","やゆよゃゅょ"],["ら","らりるれろ"],["わ","わをんゎ"]];
function hira(s){return (s||"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).trim()}
function sortKey(r){return hira(sortBy==="nm"?(r.nameKana||r.name||r.companyKana||r.company):(r.companyKana||r.company))}
function rowOf(r){const c=sortKey(r).charAt(0);for(const[h,cs]of ROWS)if(cs.includes(c))return h;return "他"}
const coll=new Intl.Collator("ja");

// ===== 封筒の描画（横向き 235×120mm の座標で描く） =====
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif';
const PT=0.3528; // 1pt=mm
function fitText(ctx,txt,x,y,pt,maxW){
  let size=pt*PT; ctx.font=size+"px "+FONT;
  const w=ctx.measureText(txt).width; if(w>maxW){size*=maxW/w; ctx.font=size+"px "+FONT;}
  ctx.fillText(txt,x,y);
}
function recipLines(r){
  const org=[r.company,...(r.dept||"").split("\n")].map(s=>(s||"").trim()).filter(Boolean);
  let name=(r.name||"").trim(), honor=r.honor||"";
  if(!name && org.length && honor){ // 担当者なし → 御中
    const h=(honor==="様")?"御中":honor; org[org.length-1]+="　"+h; honor="";
  }
  return {org,name:name?name+honor:""};
}
function drawEnvelope(ctx,r){ // ctx は mm 単位・横向き
  ctx.fillStyle="#fff";ctx.fillRect(-20,-20,275,160);
  ctx.save(); ctx.translate(+set.dx||0,+set.dy||0);
  ctx.fillStyle="#000"; ctx.textBaseline="middle";
  const X=46.8, MAXW=235-X-14;
  let y=35.6;
  const zip=(r.zip||"").trim();
  if(zip) fitText(ctx,(zip.startsWith("〒")?"":"〒")+zip,43.5,y,14,80);
  y=45.1;
  const addr=[r.addr1,r.addr2].map(s=>(s||"").trim()).filter(Boolean);
  addr.forEach(a=>{fitText(ctx,a,X,y,14,MAXW);y+=6.0});
  const L=recipLines(r);
  y+= (addr.length?2.2:0);
  L.org.forEach(o=>{fitText(ctx,o,X,y,14,MAXW);y+=5.9});
  if(L.name){y+=4.0; fitText(ctx,L.name,57.1,y,18,235-57.1-14);}
  // 差出人
  const fl=(set.from||"").split("\n");
  let sy=81.0;
  fl.forEach((t,i)=>{ if(i===0){fitText(ctx,t,144.5,sy,14,80);sy+=6.0}else{fitText(ctx,t,144.5,sy,10.5,82);sy+=6.1} });
  ctx.restore();
}
function drawPreview(cv,r){ // 画面用：横向き
  const w=cv.clientWidth||600, dpr=window.devicePixelRatio||1, s=w/235*dpr;
  cv.width=Math.round(235*s); cv.height=Math.round(120*s); cv.style.height=(w*120/235)+"px";
  const ctx=cv.getContext("2d"); ctx.setTransform(s,0,0,s,0,0); drawEnvelope(ctx,r);
}
function renderPage(r){ // 印刷用：縦 120×235mm に回転して描く
  const s=12, cv=document.createElement("canvas"); cv.width=120*s; cv.height=235*s;
  const ctx=cv.getContext("2d");
  if(!set.flip){ctx.setTransform(0,s,-s,0,120*s,0);} // 時計回り90°
  else{ctx.setTransform(0,-s,s,0,0,235*s);}         // 反時計回り90°
  drawEnvelope(ctx,r);
  return cv;
}

// ===== PDF =====
let pdfBlob=null,pdfName="";
async function buildPdf(recs){
  if(!window.jspdf)throw new Error("PDFの部品が読み込めません（通信を確認）");
  try{await document.fonts.ready}catch(e){}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:[120,235],orientation:"portrait",compress:true});
  recs.forEach((r,i)=>{ if(i)doc.addPage([120,235],"portrait");
    doc.addImage(renderPage(r).toDataURL("image/jpeg",0.92),"JPEG",0,0,120,235); });
  pdfBlob=doc.output("blob");
  pdfName=recs.length===1?("封筒_"+(recs[0].company||recs[0].name||"宛先").replace(/[\\/:*?"<>|\s]/g,"")+".pdf"):("封筒_"+recs.length+"件.pdf");
  return new File([pdfBlob],pdfName,{type:"application/pdf"});
}
async function makePdf(recs){
  try{await buildPdf(recs)}catch(e){toast(e.message);return}
  $("pTitle").textContent="PDFができました";
  $("pNote").textContent=pdfName+(recs.length>1?"（"+recs.length+"ページ）":"");
  show("shPdf");
}
// 印刷：共有画面の「プリント」から印刷（URLや日付が入らない）
let ready=null; // {key,file}
function keyOf(recs){return recs.map(r=>r.id+":"+(r.t||0)).join(",")+JSON.stringify(set)}
function prepare(recs){const k=keyOf(recs);if(ready&&ready.key===k)return;ready={key:k,file:null};
  buildPdf(recs).then(f=>{if(ready&&ready.key===k)ready.file=f}).catch(()=>{})}
async function printRecs(recs){
  const k=keyOf(recs);let f=ready&&ready.key===k?ready.file:null;
  if(!f){try{f=await buildPdf(recs)}catch(e){toast(e.message);return}ready={key:k,file:f}}
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});return}
    catch(e){if(e&&e.name==="AbortError")return}
    pdfBlob=f;pdfName=f.name;$("pTitle").textContent="準備ができました";$("pNote").textContent="「共有・印刷」を押して、出てきた画面で「プリント」を選んでください。";show("shPdf");
  }else{const u=URL.createObjectURL(f);window.open(u,"_blank")}
}
$("pShare").onclick=async()=>{
  const f=pdfBlob instanceof File?pdfBlob:new File([pdfBlob],pdfName,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else $("pOpen").onclick();
};
$("pOpen").onclick=()=>{const u=URL.createObjectURL(pdfBlob);const a=document.createElement("a");a.href=u;a.target="_blank";a.download=pdfName;a.click();};
$("pClose").onclick=()=>hide("shPdf");

// ===== 一覧 =====
function $(id){return document.getElementById(id)}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let sortBy="co", selMode=false, sel=new Set(), cur=null;
function filtered(){
  const q=hira($("q").value).replace(/\s|　/g,"").toLowerCase();
  let a=live().filter(r=>!q||hira([r.company,r.companyKana,r.dept,r.name,r.nameKana,r.addr1,r.addr2,r.zip,r.memo].join("")).replace(/\s|　/g,"").toLowerCase().includes(q));
  return a.sort((x,y)=>coll.compare(sortKey(x),sortKey(y)));
}
function renderList(){
  const a=filtered(), g={};
  a.forEach(r=>{(g[rowOf(r)]=g[rowOf(r)]||[]).push(r)});
  const order=[...ROWS.map(r=>r[0]),"他"];
  $("idx").innerHTML=order.map(h=>`<button class="${g[h]?"":"off"}" data-j="${h}">${h}</button>`).join("");
  let h="";
  order.forEach(k=>{ if(!g[k])return;
    h+=`<div class="gh" id="g_${k}">${k}行</div>`;
    g[k].forEach(r=>{const L=recipLines(r);
      h+=`<div class="item" data-id="${r.id}">${selMode?`<input type="checkbox" ${sel.has(r.id)?"checked":""}>`:""}<div class="t"><div class="c">${esc(r.company||r.name)}</div><div class="n">${esc([(r.dept||"").replace(/\n/g," "),L.name].filter(Boolean).join("　"))}</div><div class="a">〒${esc(r.zip)} ${esc(r.addr1)}</div></div></div>`;});
  });
  $("list").innerHTML=h||`<div class="empty">${live().length?"見つかりません":"宛先がありません"}</div>`;
  updateBar();
}
$("idx").onclick=e=>{const j=e.target.dataset.j;if(!j)return;const el=$("g_"+j);if(el){const y=el.getBoundingClientRect().top+scrollY-document.querySelector("header").offsetHeight-6;scrollTo({top:y,behavior:"smooth"})}};
$("list").onclick=e=>{const it=e.target.closest(".item");if(!it)return;const id=it.dataset.id;
  if(selMode){sel.has(id)?sel.delete(id):sel.add(id);renderList();return}
  openView(id)};
$("q").oninput=renderList;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));renderList()});
$("bSel").onclick=()=>{selMode=!selMode;sel.clear();$("bSel").textContent=selMode?"やめる":"選択";renderList()};
function updateBar(){
  $("bar").innerHTML=selMode?`<button class="pri" id="bMulti" ${sel.size?"":"disabled"}>選んだ ${sel.size} 件を印刷</button>`:`<button class="pri" id="bAdd">＋ 新しい宛先</button>`;
  if(selMode){const a=()=>filtered().filter(r=>sel.has(r.id));if(sel.size)prepare(a());$("bMulti").onclick=()=>printRecs(a())}
  else $("bAdd").onclick=()=>openEdit(null);
}

// ===== 詳細 =====
function show(id){$(id).classList.add("show")} function hide(id){$(id).classList.remove("show")}
function openView(id){cur=data.find(r=>r.id===id);if(!cur)return;$("vTitle").textContent=cur.company||cur.name;show("shView");requestAnimationFrame(()=>drawPreview($("vCan"),cur));setTimeout(()=>prepare([cur]),300)}
$("vClose").onclick=()=>hide("shView");
$("vPrint").onclick=()=>printRecs([cur]);

$("vEdit").onclick=()=>{hide("shView");openEdit(cur)};
$("vDup").onclick=()=>{hide("shView");openEdit({...cur,id:null,name:"",nameKana:""})};
$("vDel").onclick=()=>{if(!confirm("「"+(cur.company||cur.name)+"」を削除しますか？"))return;cur.x=1;touch(cur);save();hide("shView");renderList();toast("削除しました")};

// ===== 編集 =====
const FIELDS=["zip","addr1","addr2","company","companyKana","dept","name","nameKana","honor","memo"];
let editId=null;
function formRec(){const r={};FIELDS.forEach(f=>r[f]=$("e_"+f).value);return r}
function openEdit(r){
  editId=r&&r.id||null; $("eTitle").textContent=editId?"宛先を編集":"新しい宛先";
  FIELDS.forEach(f=>$("e_"+f).value=r?(r[f]??""):(f==="honor"?"様":""));
  show("shEdit"); requestAnimationFrame(()=>drawPreview($("eCan"),formRec()));
}
FIELDS.forEach(f=>$("e_"+f).addEventListener("input",()=>drawPreview($("eCan"),formRec())));
$("e_zip").addEventListener("blur",()=>{const d=$("e_zip").value.replace(/[^0-9０-９]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(d.length===7){$("e_zip").value=d.slice(0,3)+"-"+d.slice(3);drawPreview($("eCan"),formRec())}});
$("eZip").onclick=async()=>{
  const d=$("e_zip").value.replace(/[^0-9]/g,"");if(d.length!==7){toast("郵便番号を7桁で入れてください");return}
  try{const j=await (await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+d)).json();
    if(j.results&&j.results[0]){const x=j.results[0];$("e_addr1").value=x.address1+x.address2+x.address3;$("e_zip").value=d.slice(0,3)+"-"+d.slice(3);drawPreview($("eCan"),formRec());$("e_addr1").focus()}
    else toast("見つかりませんでした")}catch(e){toast("検索できませんでした")}
};
$("eCancel").onclick=()=>hide("shEdit");
$("eSave").onclick=()=>{
  const r=formRec(); if(!r.company.trim()&&!r.name.trim()){toast("会社名か氏名を入れてください");return}
  if(editId){const o=data.find(x=>x.id===editId);Object.assign(o,r);touch(o)}else{r.id="u"+Date.now().toString(36)+Math.floor(Math.random()*1e4);touch(r);data.push(r);editId=r.id}
  save();hide("shEdit");renderList();toast("保存しました");openView(editId);
};

// ===== 設定 =====
$("bSet").onclick=()=>{$("s_from").value=set.from;$("s_dx").value=set.dx;$("s_dy").value=set.dy;$("s_flip").checked=!!set.flip;$("sCount").textContent=live().length;$("sLogin").textContent=online?"ログアウト":"Microsoftでログイン";show("shSet")};
$("sClose").onclick=()=>hide("shSet");
$("sSave").onclick=()=>{set={from:$("s_from").value,dx:parseFloat($("s_dx").value)||0,dy:parseFloat($("s_dy").value)||0,flip:$("s_flip").checked};saveSet();hide("shSet");toast("保存しました")};
$("sExport").onclick=async()=>{
  const b=new Blob([JSON.stringify({app:"futo",ver:1,settings:set,items:live()},null,1)],{type:"application/json"});
  const name="封筒宛先_"+new Date().toISOString().slice(0,10)+".json", f=new File([b],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}
};
$("sImport").onclick=()=>$("sFile").click();
$("sFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const items=j.items||j;
    if(!Array.isArray(items))throw 0;
    const mode=confirm("OK＝今の宛先を置き換える\nキャンセル＝今の宛先に追加する");
    const now=Date.now(),ids=new Set(items.map(r=>r.id));if(mode)data.forEach(r=>{if(!ids.has(r.id)&&!r.x){r.x=1;r.t=now}});const have=new Set(data.filter(r=>!r.x).map(r=>r.id));items.forEach(r=>{if(mode||!have.has(r.id)){const o={...r,t:now};delete o.x;data=data.filter(d=>d.id!==r.id);data.push(o)}})
    if(j.settings&&confirm("差出人などの設定も読み込みますか？")){set={...DEF_SET,...j.settings};saveSet()}
    save();renderList();hide("shSet");toast(live().length+"件になりました");
  }catch(err){toast("読み込めませんでした")}
  e.target.value="";
};

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.classList.remove("show")}));

$("sLogin").onclick=()=>{if(online){pca.logoutRedirect()}else{hide("shSet");$("login").style.display="flex"}};
$("lg").onclick=()=>pca?pca.loginRedirect({scopes:SC}):($("lerr").textContent="ログインの部品が読み込めませんでした（通信を確認）");
$("lgSkip").onclick=startLocal;
loadLocal(); renderList();
try{pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  pca.initialize().then(()=>pca.handleRedirectPromise()).then(r=>{const a=(r&&r.account)||pca.getAllAccounts()[0];if(a){pca.setActiveAccount(a);startSync()}else $("login").style.display="flex"})
  .catch(e=>{$("login").style.display="flex";$("lerr").textContent="ログインエラー："+e.message})
}catch(e){$("login").style.display="flex";$("lerr").textContent="読み込みエラー："+e.message}
</script>
