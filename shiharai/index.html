<title>支払管理 | SML</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<style>
:root{
  --bg:#f4f4f2; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e3e3e0;
  --paid:#2f7d4f; --paid-bg:#e7f3ec; --due:#c0392b; --due-bg:#fbeaea;
  --soon:#b9770e; --soon-bg:#fdf3e1; --quote:#8e8e93; --quote-bg:#efeff1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sync{flex:none;background:none;border:0;color:#bbb;font-size:11px;padding:4px 2px;font-family:inherit}
header select{width:auto;flex:none;background:#333;color:#fff;border:0;border-radius:8px;padding:6px 8px;font-size:15px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:10.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);font-weight:600}
.badge-dot{position:relative}
.badge-dot[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--due);color:#fff;
  font-size:10px;border-radius:9px;padding:1px 5px;font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.kpi.red{background:var(--due-bg)} .kpi.red .v{color:var(--due)}
.kpi.wide{grid-column:1/3}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%}
.bar .seg{border-radius:3px 3px 0 0}
.bar .seg.u{background:#e3b3ac}
.bar .seg.p{background:var(--ink);border-radius:0}
.bar .seg.p:first-child{border-radius:3px 3px 0 0}
.bar .m{font-size:10px;color:var(--sub);text-align:center;margin-top:4px}
.bar.sel .m{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;font-size:11px;margin-top:2px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;font-weight:600}
.tag.paid{background:var(--paid-bg);color:var(--paid)}
.tag.due{background:var(--due-bg);color:var(--due)}
.tag.soon{background:var(--soon-bg);color:var(--soon)}
.tag.wait{background:#eef2f7;color:#41618a}
.tag.quote{background:var(--quote-bg);color:var(--quote)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--paid);border-color:var(--paid)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input[type=search],input[type=text],input[type=date],input[type=month],input[type=number],input[type=tel],select,textarea{
  font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.toolbar input[type=search]{flex:1;min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;line-height:24px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
.inline input,.inline select{height:44px}
header .add{flex:none;border:0;background:#fff;color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700}
.toolbar select{width:auto;min-width:0}
.btn{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.btn.sub{background:#e9e9e6;color:var(--ink)}
.btn.green{background:var(--paid)}
.btn.red{background:var(--due)}
.btn.block{width:100%;display:block;margin-top:8px}
.btn.sm{padding:7px 10px;font-size:13px}
.seg3{display:flex;background:#ececea;border-radius:10px;padding:3px;gap:3px}
.seg3 button{flex:1;border:0;background:none;border-radius:8px;padding:9px 4px;font:inherit;font-size:14px;color:var(--sub)}
.seg3 button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg3 button.on.paid{color:var(--paid)}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;line-height:1.7}
.grp{font-size:12px;color:var(--sub);font-weight:600;padding:12px 4px 6px;display:flex;justify-content:space-between}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s,visibility .22s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;background:#ccc;border-radius:3px;margin:4px auto 10px}
.sheet h3{margin:4px 44px 4px 0;font-size:17px}
.sheet .x{position:sticky;top:0;float:right;margin:-2px -4px 0 0;width:34px;height:34px;border-radius:17px;border:0;background:#e3e3e0;color:var(--ink);font-size:16px;z-index:2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--sub)} .kv dd{margin:0;word-break:break-all}
.note{white-space:pre-wrap;font-size:13px;color:var(--sub);background:#fff;border-radius:10px;padding:10px;margin-top:10px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:#fff;
  border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.selbar.show{display:flex}
.selbar span{flex:1;font-size:13px;min-width:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.mt th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.mt td{text-align:right;padding:10px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mt th:first-child,.mt td:first-child{text-align:left;white-space:normal}
.mt td:nth-child(3){font-weight:700}
.mt td.un{color:var(--due)}
.mt tbody tr[data-month]{cursor:pointer}
.mt tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;margin-bottom:10px}
/* 振込先 */
.bank{background:#f7f7f5;border-radius:10px;padding:10px 12px;margin:2px 0 6px}
.bank .bl{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.bank .bl .k{color:var(--sub);font-size:12px;width:52px;flex:none}
.bank .bl .v{flex:1;min-width:0;word-break:break-all;font-variant-numeric:tabular-nums}
.cp{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;color:var(--ink)}
.vh{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.vh .main{flex:1;min-width:0}
.vh .t{font-weight:700;font-size:16px}
.vh .amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.warnbox{background:var(--soon-bg);color:var(--soon);border-radius:10px;padding:9px 12px;font-size:13px;margin:2px 0 6px}
</style>
</head>
<body>
<header>
  <h1 id="ttl">支払管理</h1>
  <button id="syncBtn" class="sync" hidden></button>
  <button class="add" id="hdrAdd">＋ 追加</button>
  <select id="yearSel" aria-label="年"></select>
</header>
<main id="main"></main>

<div class="selbar" id="selbar"><span id="selInfo"></span>
  <button class="btn sm sub" id="selCancel">やめる</button>
  <button class="btn sm green" id="selPay">支払済に</button>
</div>

<nav id="nav">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="unpaid"><span class="badge-dot" id="unpaidBadge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>未払い</button>
  <button data-tab="paid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>支払済</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>すべて</button>
  <button data-tab="vendors"><svg viewBox="0 0 24 24"><path d="M3 21V7l6-4v18M9 21h12V11l-6-3"/><path d="M13 13h4M13 17h4"/></svg>取引先</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M4 17v3h16v-3M12 3v12M7 10l5 5 5-5"/></svg>データ</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ===== 保存（前の版のデータをそのまま使う） ===== */
const KEY='gaichu_v1';
const DEF_ACC=['外注費','仕入高','材料費','消耗品費','工具器具備品','修繕費','通信費','地代家賃','水道光熱費','車両費','旅費交通費','支払手数料','雑費'];
const DEF_SET={accounts:DEF_ACC,bank:'普通預金',bankSub:'',taxMode:'honsoku'};
const DEF_TERMS={month:1,day:'end'}; // 末締め翌月末払い
function migrate(p){
  p=p||{};
  const st=Object.assign({},DEF_SET,p.settings||{});
  if(!Array.isArray(st.accounts)||!st.accounts.length)st.accounts=[...DEF_ACC];
  if(st.account){if(!st.accounts.includes(st.account))st.accounts.unshift(st.account);}
  const old=st.account||'外注費';delete st.account;
  p.invoices=Array.isArray(p.invoices)?p.invoices:[];p.vendors=Array.isArray(p.vendors)?p.vendors:[];
  p.invoices.forEach(i=>{if(!i.account)i.account=old;if(!i.rate)i.rate='10';if(!i.targetYM&&i.payDate)i.targetYM=i.payDate.slice(0,7);});
  p.vendors.forEach(v=>{if(v.defAcc===undefined)v.defAcc=old;
    if(v.bank&&!v.bankMemo&&!v.bankName){v.bankMemo=v.bank;} delete v.bank;});
  p.settings=st;p.deleted=p.deleted||{};return p;
}
let D=migrate({});
try{const s=localStorage.getItem(KEY);if(s)D=migrate(JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('保存できませんでした');}}
function save(){persist();Sync.later();}
const stamp=o=>{o.updatedAt=Date.now();return o;};
function markDel(id){D.deleted[id]=Date.now();}

/* ===== 便利関数 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const man=n=>{n=n||0;return n>=10000?(Math.round(n/1000)/10).toLocaleString('ja-JP')+'万':Math.round(n).toLocaleString('ja-JP')};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';
const mlabel=s=>s?(+s.slice(5,7))+'月':'';
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const zen2han=s=>String(s||'').replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
const vendor=id=>D.vendors.find(v=>v.id===id);
const vname=id=>(vendor(id)||{}).name||'(削除された取引先)';
const findV=name=>{const n=(name||'').trim();return n?D.vendors.find(v=>v.name===n):null;};
const taxOf=i=>i.rate==='8'?Math.floor(i.amount*8/108):i.rate==='0'?0:Math.floor(i.amount*10/110);
const rateLabel=r=>r==='8'?'軽減8%':r==='0'?'対象外':'10%';
const allInv=()=>D.invoices;
const sum=a=>a.reduce((s,i)=>s+(i.amount||0),0);
const isPaid=i=>!!i.payDate;
const baseYM=i=>i.targetYM||(i.payDate||'').slice(0,7);
function copy(txt,label){
  const done=()=>toast((label||'')+'コピーしました');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(String(txt)).then(done,()=>fallback());else fallback();
  function fallback(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){}t.remove();}
}

/* ===== インボイス ===== */
function normTNo(t){return zen2han(t).replace(/[ｔ]/g,'T').replace(/[\s-]/g,'').toUpperCase();}
function checkTNo(t){
  if(!t)return '';
  t=normTNo(t);
  if(!/^T\d{13}$/.test(t))return 'NG';
  const d=t.slice(1).split('').map(Number);
  let s=0;for(let i=1;i<=12;i++)s+=d[13-i]*(i%2===1?1:2);
  return (9-(s%9))===d[0]?'OK':'NG';
}
function autoKubun(inv){
  if(inv.kubun&&inv.kubun!=='auto')return inv.kubun;
  const v=vendor(inv.vendorId);
  return v&&checkTNo(v.tno)==='OK'?'tekikaku':'kubun';
}
function koujoPct(date){return date<'2026-10-01'?'80%':date<'2029-10-01'?'50%':'控不';}
function taxCode(inv){
  if(inv.rate==='0')return '対象外';
  const s=inv.rate==='8'?'課対仕入内軽減8%':'課対仕入内10%';
  if(D.settings.taxMode!=='honsoku'||!inv.payDate||inv.payDate<'2023-10-01')return s;
  return autoKubun(inv)==='tekikaku'?s+'適格':s+'区分'+koujoPct(inv.payDate);
}

/* ===== 支払予定日 ===== */
function terms(v){return Object.assign({},DEF_TERMS,v&&v.terms||{});}
function dueDate(inv){
  if(inv.dueOverride)return inv.dueOverride;
  const b=baseYM(inv);if(!b)return '';
  const t=terms(vendor(inv.vendorId));
  let y=+b.slice(0,4),m=+b.slice(5,7)+(+t.month);
  while(m>12){m-=12;y++;}
  const dd=t.day==='end'?lastDay(y,m):Math.min(+t.day,lastDay(y,m));
  return y+'-'+pad(m)+'-'+pad(dd);
}
function termsLabel(t){
  const m=['当月','翌月','翌々月','3か月後'][+t.month]||t.month+'か月後';
  return '末締め '+m+(t.day==='end'?'末':t.day+'日')+'払い';
}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);}
function state(inv){
  if(isPaid(inv))return {k:'paid',label:'支払済 '+md(inv.payDate)};
  const due=dueDate(inv),t=today();
  if(due&&due<t)return {k:'due',label:daysBetween(due,t)+'日過ぎ',due};
  if(due&&daysBetween(t,due)<=7)return {k:'soon',label:'もうすぐ '+md(due),due};
  return {k:'wait',label:due?'予定 '+md(due):'予定なし',due};
}

/* ===== 年 ===== */
let year=null;
function years(){
  const s=new Set();allInv().forEach(i=>{const b=baseYM(i);if(b)s.add(b.slice(0,4));if(i.payDate)s.add(i.payDate.slice(0,4));});
  s.add(String(new Date().getFullYear()));return [...s].sort().reverse();
}
function fillYears(){
  const ys=years();if(!year||!ys.includes(year))year=ys.includes(String(new Date().getFullYear()))?String(new Date().getFullYear()):ys[0];
  $('#yearSel').innerHTML=ys.map(y=>`<option ${y===year?'selected':''} value="${y}">${y}年</option>`).join('');
}
$('#yearSel').onchange=e=>{year=e.target.value;filt.month='';render();};

/* ===== タブ ===== */
let tab='home',selMode=false,sel=new Set(),filt={q:'',st:'all',acc:'',month:'',ugroup:'vendor',pv:''},vendorOpen=null;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;vendorOpen=null;filt.month='';exitSel();render();scrollTo(0,0);});
function render(){
  fillYears();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const overdue=allInv().filter(i=>state(i).k==='due').length;
  $('#unpaidBadge').dataset.n=overdue>99?'99+':overdue;
  $('#yearSel').style.visibility=(tab==='home'||tab==='list'||tab==='paid'||tab==='vendors')?'visible':'hidden';
  const titles={home:'支払管理',unpaid:'未払い',paid:'支払済',list:'すべての請求書',vendors:'取引先',data:'データ'};
  $('#ttl').textContent=vendorOpen?vname(vendorOpen):titles[tab];
  const m=$('#main');
  if(!allInv().length&&tab!=='data'&&tab!=='vendors'){m.innerHTML=emptyStart();bind();return;}
  if(tab==='home')m.innerHTML=homeView();
  if(tab==='unpaid')m.innerHTML=unpaidView();
  if(tab==='paid')m.innerHTML=paidView();
  if(tab==='list')m.innerHTML=listView();
  if(tab==='vendors')m.innerHTML=vendorOpen?vendorDetail(vendorOpen):vendorsView();
  if(tab==='data')m.innerHTML=dataView();
  bind();
}
function emptyStart(){
  return `<div class="card empty"><b>届いた請求書を登録していきます</b><br>外注・仕入・経費など、請求書で来るものを全部入れられます。<br>
  <button class="btn block" data-act="add">＋ 請求書を追加</button>
  <p class="muted" style="margin-top:16px">iPadなど2台目で使うときは、こちらから</p>
  <button class="btn sub block" data-act="login">${Sync.account()?'OneDriveから読み込む':'Microsoftでログインして読み込む'}</button></div>`;
}

/* ===== ホーム ===== */
function homeView(){
  const yr=allInv().filter(i=>baseYM(i).startsWith(year));
  const paid=yr.filter(isPaid),unpaid=yr.filter(i=>!isPaid(i));
  const allDue=allInv().filter(i=>state(i).k==='due');
  const nowM=today().slice(0,7);
  const comingM=allInv().filter(i=>!isPaid(i)&&dueDate(i).startsWith(nowM));
  const allUn=allInv().filter(i=>!isPaid(i));
  const months=[];for(let m=1;m<=12;m++){const k=year+'-'+pad(m);const a=yr.filter(i=>baseYM(i)===k);
    months.push({m,n:a.length,p:sum(a.filter(isPaid)),u:sum(a.filter(i=>!isPaid(i)))});}
  const max=Math.max(1,...months.map(x=>x.p+x.u));
  const bars=months.map(x=>{const h1=x.u/max*100,h2=x.p/max*100;
    return `<div class="bar ${year+'-'+pad(x.m)===nowM?'sel':''}"><div style="flex:1"></div>${x.u?`<div class="seg u" style="height:${h1}%"></div>`:''}${x.p?`<div class="seg p" style="height:${h2}%"></div>`:''}<div class="m">${x.m}</div></div>`;}).join('');
  const mOpts=months.filter(x=>x.n).map(x=>year+'-'+pad(x.m));
  if(filt.accM&&!mOpts.includes(filt.accM))filt.accM='';
  const src=filt.accM?yr.filter(i=>baseYM(i)===filt.accM):yr;
  const byA={};src.forEach(i=>byA[i.account]=(byA[i.account]||0)+i.amount);
  const accRows=Object.entries(byA).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="kpis">
    <div class="kpi wide"><div class="l">${year}年の支払（請求書の合計）</div><div class="v">${yen(sum(yr))}</div><div class="s">${yr.length}件</div></div>
    <div class="kpi"><div class="l">支払済</div><div class="v" style="color:var(--paid)">${man(sum(paid))}</div><div class="s">${paid.length}件</div></div>
    <div class="kpi" data-go="unpaid"><div class="l">未払い（全期間）</div><div class="v">${man(sum(allUn))}</div><div class="s">${allUn.length}件</div></div>
    <div class="kpi red wide" data-go="unpaid"><div class="l">支払日を過ぎた未払い</div><div class="v">${yen(sum(allDue))}</div><div class="s">${allDue.length}件 ・ タップで未払い一覧へ</div></div>
    <div class="kpi wide" data-go="unpaid"><div class="l">今月の支払予定</div><div class="v">${yen(sum(comingM))}</div><div class="s">${comingM.length}件</div></div>
  </div>
  <div class="card"><h2>月別の支払（${year}年・何月分で集計）</h2><div class="bars">${bars}</div>
    <div class="legend"><span><i style="background:var(--ink)"></i>支払済</span><span><i style="background:#e3b3ac"></i>未払い</span></div></div>
  <div class="card"><h2>科目別</h2>

    ${months.filter(x=>x.n).map(x=>`<tr data-month="${year}-${pad(x.m)}"><td>${x.m}月分</td><td>${x.n}</td><td>${yen(x.p+x.u)}</td><td class="${x.u?'un':''}">${x.u?yen(x.u):'－'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">まだありません</td></tr>'}
    </tbody><tfoot><tr><td>合計</td><td>${yr.length}</td><td>${yen(sum(yr))}</td><td>${sum(unpaid)?yen(sum(unpaid)):'－'}</td></tr></tfoot></table>
    <p class="muted" style="margin:8px 0 0">月をタップすると、その月の請求書が見られます。</p></div>`;

/* ===== 行 ===== */
function rowHTML(i,opt){
  const s=state(i);opt=opt||{};
  const selc=selMode?`<div class="chk ${sel.has(i.id)?'on':''}"></div>`:'';
  const top=opt.noVendor?(mlabel(baseYM(i))+'分'+(i.memo?' '+i.memo:'')):vname(i.vendorId);
  const sub=opt.noVendor?esc(i.account):(mlabel(baseYM(i))+'分 ・ '+esc(i.account)+(i.memo?' ・ '+esc(i.memo):''));
  return `<div class="row" data-id="${i.id}">${selc}
    <div class="main"><div class="t">${esc(top)}</div><div class="d">${sub}</div></div>
    <div class="amt">${yen(i.amount)}<small><span class="tag ${s.k}">${esc(s.label)}</span></small></div></div>`;
}
function bankHTML(v,amount){
  if(!v)return '';
  const has=v.bankName||v.bankNo||v.bankHolder;
  const line=(k,val,cp)=>val?`<div class="bl"><span class="k">${k}</span><span class="v">${esc(val)}</span>${cp?`<button class="cp" data-copy="${esc(val)}" data-cl="${k}を">コピー</button>`:''}</div>`:'';
  let h='';
  if(has){
    h+=`<div class="bank">${line('銀行',[v.bankName,v.bankBranch].filter(Boolean).join(' '),false)}
      ${v.bankNo?`<div class="bl"><span class="k">口座</span><span class="v">${esc(v.bankType||'普通')} ${esc(v.bankNo)}</span><button class="cp" data-copy="${esc(v.bankNo)}" data-cl="口座番号を">コピー</button></div>`:''}
      ${line('名義',v.bankHolder,true)}
      ${amount!=null?`<div class="bl"><span class="k">振込額</span><span class="v"><b>${yen(amount)}</b></span><button class="cp" data-copy="${amount}" data-cl="金額を">コピー</button></div>`:''}
      ${v.bankMemo?`<div class="bl"><span class="k">メモ</span><span class="v">${esc(v.bankMemo)}</span></div>`:''}</div>`;
  }else if(v.bankMemo){
    h+=`<div class="bank"><div class="bl"><span class="k">振込先</span><span class="v" style="white-space:pre-wrap">${esc(v.bankMemo)}</span><button class="cp" data-copy="${esc(v.bankMemo)}" data-cl="振込先を">コピー</button></div>
      ${amount!=null?`<div class="bl"><span class="k">振込額</span><span class="v"><b>${yen(amount)}</b></span><button class="cp" data-copy="${amount}" data-cl="金額を">コピー</button></div>`:''}</div>`;
  }else{
    h+=`<div class="warnbox" data-editv="${v.id}">振込先が未登録です → タップして登録</div>`;
  }
  return h;
}

/* ===== 未払い ===== */
function unpaidView(){
  const a=allInv().filter(i=>!isPaid(i));
  const due=a.filter(i=>state(i).k==='due');
  let body='';
  if(!a.length)body='<div class="card empty">未払いはありません 🎉</div>';
  else if(filt.ugroup==='vendor'){
    const g={};a.forEach(i=>(g[i.vendorId]=g[i.vendorId]||[]).push(i));
    const ids=Object.keys(g).sort((x,y)=>{const dx=g[x].map(dueDate).sort()[0]||'9',dy=g[y].map(dueDate).sort()[0]||'9';return dx.localeCompare(dy)||vname(x).localeCompare(vname(y),'ja');});
    body=ids.map(id=>{const items=g[id].sort((x,y)=>dueDate(x).localeCompare(dueDate(y)));const v=vendor(id);const tot=sum(items);
      const late=items.some(i=>state(i).k==='due');
      return `<div class="card"><div class="vh"><div class="main"><div class="t">${esc(vname(id))}</div><div class="muted">${items.length}件 ・ ${termsLabel(terms(v))}</div></div>
        <div class="amt" style="${late?'color:var(--due)':''}">${yen(tot)}</div></div>
        ${bankHTML(v,tot)}
        <div>${items.map(i=>rowHTML(i,{noVendor:true})).join('')}</div>
        ${selMode?'':`<button class="btn green block" data-payv="${id}">この${items.length}件をまとめて支払済に</button>`}</div>`;}).join('');
  }else{
    const t=today(),g=[],idx={};
    [...a].sort((x,y)=>dueDate(x).localeCompare(dueDate(y))).forEach(i=>{const d=dueDate(i);const k=!d?'none':d<t?'late':d.slice(0,7);
      if(!(k in idx)){idx[k]=g.length;g.push({k,items:[]});}g[idx[k]].items.push(i);});
    g.sort((x,y)=>x.k==='late'?-1:y.k==='late'?1:x.k==='none'?1:y.k==='none'?-1:x.k.localeCompare(y.k));
    body=g.map(x=>{const label=x.k==='late'?'<span style="color:var(--due)">支払日を過ぎたもの</span>':x.k==='none'?'予定日なし':(x.k===t.slice(0,7)?'今月':(x.k.slice(0,4)!==t.slice(0,4)?x.k.slice(0,4)+'年':'')+(+x.k.slice(5))+'月')+'の支払予定';
      return `<div class="grp"><span>${label}</span><span>${yen(sum(x.items))}（${x.items.length}件）</span></div><div class="card" style="padding:4px 12px">${x.items.map(i=>rowHTML(i)).join('')}</div>`;}).join('');
  }
  return `<div class="kpis"><div class="kpi"><div class="l">未払い 合計</div><div class="v">${man(sum(a))}</div><div class="s">${a.length}件</div></div>
    <div class="kpi red"><div class="l">うち支払日過ぎ</div><div class="v">${man(sum(due))}</div><div class="s">${due.length}件</div></div></div>
  <div class="toolbar"><div class="seg3" style="flex:1"><button data-ug="vendor" class="${filt.ugroup==='vendor'?'on':''}">取引先ごと</button><button data-ug="date" class="${filt.ugroup==='date'?'on':''}">支払日順</button></div>
    <button class="btn sm ${selMode?'':'sub'}" id="selToggle">${selMode?'選択中':'選ぶ'}</button></div>
  ${body}
  <p class="muted">支払予定日は取引先ごとの支払条件（初期設定：末締め翌月末払い、何月分の請求かで計算）から出しています。</p>`;
}

/* ===== 支払済 ===== */
function paidView(){
  let a=allInv().filter(i=>isPaid(i)&&i.payDate.startsWith(year));
  const vs=[...new Set(a.map(i=>i.vendorId))].sort((x,y)=>vname(x).localeCompare(vname(y),'ja'));
  if(filt.pv)a=a.filter(i=>i.vendorId===filt.pv);
  a.sort((x,y)=>y.payDate.localeCompare(x.payDate));
  const g={};a.forEach(i=>(g[i.payDate.slice(0,7)]=g[i.payDate.slice(0,7)]||[]).push(i));
  const html=Object.keys(g).map(k=>`<div class="grp"><span>${+k.slice(5)}月に支払</span><span>${yen(sum(g[k]))}</span></div><div class="card" style="padding:4px 12px">${g[k].map(i=>rowHTML(i)).join('')}</div>`).join('');
  return `<div class="kpis"><div class="kpi wide"><div class="l">${year}年に支払った金額</div><div class="v" style="color:var(--paid)">${yen(sum(a))}</div><div class="s">${a.length}件（支払日で集計）</div></div></div>
  <div class="toolbar"><select id="fPV" style="flex:1"><option value="">すべての取引先</option>${vs.map(v=>`<option value="${v}" ${v===filt.pv?'selected':''}>${esc(vname(v))}</option>`).join('')}</select>
    <button class="btn sm ${selMode?'':'sub'}" id="selToggle">${selMode?'選択中':'選ぶ'}</button></div>
  ${html||'<div class="card empty">この年の支払済はまだありません</div>'}`;
}

/* ===== すべて ===== */
function listView(){
  let a=allInv().filter(i=>baseYM(i).startsWith(filt.month||year));
  const q=filt.q.trim().toLowerCase();
  if(q)a=a.filter(i=>(vname(i.vendorId)+' '+i.account+' '+(i.memo||'')).toLowerCase().includes(q));
  if(filt.st==='unpaid')a=a.filter(i=>!isPaid(i));if(filt.st==='paid')a=a.filter(isPaid);
  if(filt.acc)a=a.filter(i=>i.account===filt.acc);
  a.sort((x,y)=>baseYM(y).localeCompare(baseYM(x))||vname(x.vendorId).localeCompare(vname(y.vendorId),'ja'));
  const g={};a.forEach(i=>(g[baseYM(i)]=g[baseYM(i)]||[]).push(i));
  const accs=[...new Set(allInv().map(i=>i.account))];
  const html=Object.keys(g).map(k=>`<div class="grp"><span>${+k.slice(5)}月分</span><span>${yen(sum(g[k]))}</span></div><div class="card" style="padding:4px 12px">${g[k].map(i=>rowHTML(i)).join('')}</div>`).join('');
  const chips=(filt.month?`<button class="chip" id="clrMonth">${+filt.month.slice(5)}月分だけ表示中 ✕</button> `:'')+(filt.acc?`<button class="chip" id="clrAcc">${esc(filt.acc)}だけ表示中 ✕</button>`:'');
  return `${chips}<div class="toolbar"><input type="search" id="fq" placeholder="取引先・メモで検索" value="${esc(filt.q)}">
    <select id="fst"><option value="all">すべて</option><option value="unpaid" ${filt.st==='unpaid'?'selected':''}>未払い</option><option value="paid" ${filt.st==='paid'?'selected':''}>支払済</option></select></div>
    <div class="toolbar"><select id="facc" style="flex:1"><option value="">すべての科目</option>${accs.map(x=>`<option ${x===filt.acc?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <button class="btn sm" data-act="add">＋ 追加</button></div>
    ${a.length?`<div class="muted" style="margin:0 4px 4px">${a.length}件 ・ 合計 <b style="color:var(--ink)">${yen(sum(a))}</b></div>`:''}
    ${html||'<div class="card empty">該当する請求書はありません</div>'}`;
}

/* ===== 取引先 ===== */
function vendorsView(){
  const list=[...D.vendors].map(v=>{const inv=allInv().filter(i=>i.vendorId===v.id);
    return {v,yr:sum(inv.filter(i=>baseYM(i).startsWith(year))),un:sum(inv.filter(i=>!isPaid(i))),due:inv.filter(i=>state(i).k==='due').length};})
    .sort((a,b)=>b.yr-a.yr||(a.v.kana||a.v.name).localeCompare(b.v.kana||b.v.name,'ja'));
  return `<div class="toolbar"><button class="btn sm" id="addV">＋ 取引先を追加</button></div>
  ${list.length?`<div class="card">${list.map(x=>{const c=checkTNo(x.v.tno);const bank=x.v.bankNo||x.v.bankMemo;
    return `<div class="row" data-vendor="${x.v.id}"><div class="main"><div class="t">${esc(x.v.name)}</div>
      <div class="d">${esc(x.v.defAcc||'')} ・ ${c==='OK'?'適格':'登録番号なし'}${bank?'':' ・ <span style="color:var(--soon)">振込先未登録</span>'}</div></div>
      <div class="amt">${yen(x.yr)}<small>${x.due?`<span class="tag due">遅れ${x.due}件</span>`:x.un?`<span class="tag wait">未払い ${man(x.un)}</span>`:`<span class="tag paid">完了</span>`}</small></div></div>`;}).join('')}</div>`:'<div class="card empty">取引先はまだありません。<br>請求書を追加するときに、そのまま新しい取引先も登録できます。</div>'}`;
}
function vendorDetail(id){

  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="l">${year}年の支払</div><div class="v">${man(sum(inv.filter(i=>baseYM(i).startsWith(year))))}</div></div>
  <div class="kpi ${un.some(i=>state(i).k==='due')?'red':''}"><div class="l">未払い</div><div class="v">${man(sum(un))}</div><div class="s">${un.length}件</div></div></div>
  <div class="card"><h2>振込先</h2>${bankHTML(v,un.length?sum(un):null)}
    <dl class="kv"><dt>登録番号</dt><dd>${v.tno?esc(v.tno)+' '+(c==='OK'?'<span class="tag paid">適格</span>':'<span class="tag due">番号に誤り</span>'):'<span class="muted">なし（区分記載）</span>'}</dd>
    <dt>いつもの科目</dt><dd>${esc(v.defAcc||'')}</dd><dt>支払条件</dt><dd>${termsLabel(terms(v))}</dd>
    ${v.tel?`<dt>電話</dt><dd><a href="tel:${esc(v.tel)}">${esc(v.tel)}</a></dd>`:''}${v.address?`<dt>住所</dt><dd>${v.zip?'〒'+esc(v.zip)+' ':''}${esc(v.address)}</dd>`:''}</dl>
    ${v.memo?`<div class="note">${esc(v.memo)}</div>`:''}
    <button class="btn sub block" data-editv="${id}">取引先の情報を編集</button></div>
  <div class="toolbar"><button class="btn sm" id="addForV">＋ この取引先の請求書</button>${un.length?`<button class="btn sm green" data-payv="${id}">未払い${un.length}件を支払済に</button>`:''}</div>
  <div class="card">${inv.map(i=>rowHTML(i,{noVendor:true})).join('')||'<div class="empty">請求書はまだありません</div>'}</div>`;
}

/* ===== 操作 ===== */
function bind(){
  document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>{
    const id=r.dataset.id;
    if(selMode){sel.has(id)?sel.delete(id):sel.add(id);r.querySelector('.chk').classList.toggle('on');updSel();return;}
    openInv(id);});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render();scrollTo(0,0);});
  document.querySelectorAll('[data-vendor]').forEach(r=>r.onclick=()=>{vendorOpen=r.dataset.vendor;render();scrollTo(0,0);});
  document.querySelectorAll('[data-editv]').forEach(r=>r.onclick=()=>openVendor(r.dataset.editv));
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();copy(b.dataset.copy,b.dataset.cl);});
  document.querySelectorAll('[data-payv]').forEach(b=>b.onclick=()=>payMany(allInv().filter(i=>i.vendorId===b.dataset.payv&&!isPaid(i)).map(i=>i.id)));
  document.querySelectorAll('[data-ug]').forEach(b=>b.onclick=()=>{filt.ugroup=b.dataset.ug;render();});
  document.querySelectorAll('[data-month]').forEach(r=>r.onclick=()=>{filt.month=r.dataset.month;filt.acc='';tab='list';render();scrollTo(0,0);});
  document.querySelectorAll('[data-acc]').forEach(r=>r.onclick=()=>{filt.acc=r.dataset.acc;filt.month=filt.accM||'';tab='list';render();scrollTo(0,0);});
  const fq=$('#fq');if(fq)fq.oninput=e=>{filt.q=e.target.value;const p=fq.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p);};
  const fst=$('#fst');if(fst)fst.onchange=e=>{filt.st=e.target.value;render();};
  const fa=$('#facc');if(fa)fa.onchange=e=>{filt.acc=e.target.value;render();};
  const fp=$('#fPV');if(fp)fp.onchange=e=>{filt.pv=e.target.value;render();};
  const cm=$('#clrMonth');if(cm)cm.onclick=()=>{filt.month='';render();};
  const ca=$('#clrAcc');if(ca)ca.onclick=()=>{filt.acc='';render();};
  const st=$('#selToggle');if(st)st.onclick=()=>{selMode?exitSel():(selMode=true,updSel());render();};
  const bk=$('#back');if(bk)bk.onclick=()=>{vendorOpen=null;render();scrollTo(0,0);};
  const av=$('#addV');if(av)av.onclick=()=>openVendor(null);

/* ===== 郵便番号から住所（zipcloud） ===== */
function zipLookup(z){
  return new Promise((ok,ng)=>{
    const cb='zipcb'+Date.now();const sc=document.createElement('script');
    const tm=setTimeout(()=>{cleanup();ng();},8000);
    function cleanup(){clearTimeout(tm);delete window[cb];sc.remove();}
    window[cb]=d=>{cleanup();const r=d&&d.results&&d.results[0];ok(r?r.address1+r.address2+r.address3:null);};
    sc.onerror=()=>{cleanup();ng();};
    sc.src='https://zipcloud.ibsnet.co.jp/api/search?zipcode='+z+'&callback='+cb;
    document.body.appendChild(sc);
  });
}

/* ===== 書き出し ===== */
let SJ=null;
function sjisMap(){
  if(SJ)return SJ;SJ=new Map();const dec=new TextDecoder('shift_jis');
  for(let b=0xA1;b<=0xDF;b++)SJ.set(dec.decode(new Uint8Array([b])),[b]);
  for(let hi=0x81;hi<=0xFC;hi++){if(hi>=0xA0&&hi<=0xDF)continue;for(let lo=0x40;lo<=0xFC;lo++){if(lo===0x7F)continue;const s=dec.decode(new Uint8Array([hi,lo]));if(s.length===1&&s!=='�'&&!SJ.has(s))SJ.set(s,[hi,lo]);}}
  const alias={'～':'〜','−':'－','‖':'∥','¢':'￠','£':'￡','¬':'￢','—':'―'};
  for(const[a,b] of Object.entries(alias))if(!SJ.has(a)&&SJ.has(b))SJ.set(a,SJ.get(b));
  return SJ;
}
function toSJIS(str){const m=sjisMap(),out=[];for(const ch of str){const c=ch.codePointAt(0);if(c<0x80)out.push(c);else{const b=m.get(ch);if(b)out.push(...b);else out.push(0x3F);}}return new Uint8Array(out);}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const q=s=>{s=String(s??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const cut=(s,n)=>[...String(s||'')].slice(0,n).join('');
function exportYayoi(){
  const m=$('#exM').value,all=$('#exAll').checked;
  const list=allInv().filter(i=>isPaid(i)&&i.payDate.startsWith(m)&&(all||!i.exported)).sort((a,b)=>a.payDate.localeCompare(b.payDate));
  if(!list.length)return toast('書き出す明細がありません');
  const s=D.settings;
  const lines=list.map(i=>{
    const v=vendor(i.vendorId)||{name:''};
    const tek=cut(`${v.name} ${i.targetYM?(+i.targetYM.slice(5))+'月分':''}${i.memo?' '+i.memo:''}`.trim(),30);
    const tc=(s.taxMode==='honsoku'||i.rate==='0')?taxCode(i):(i.rate==='8'?'課対仕入内軽減8%':'課対仕入内10%');
    return ['2000','','',i.payDate.replace(/-/g,'/'),i.account,'','',tc,i.amount,taxOf(i),
      s.bank,s.bankSub,'','',i.amount,'',tek,'','','','','','','','no',cut(v.name,15),''].map(q).join(',');
  });
  download(`弥生_支払_${m}.csv`,new Blob([toSJIS(lines.join('\r\n')+'\r\n')],{type:'text/csv'}));
  setTimeout(()=>{if(confirm(`${list.length}件を書き出しました。\n弥生への取込が終わったら「OK」で「弥生済」にします。`)){list.forEach(i=>{i.exported=true;stamp(i);});save();render();}},600);
}
function exportList(){
  const m=$('#exM').value;
  const list=allInv().filter(i=>isPaid(i)&&i.payDate.startsWith(m)).sort((a,b)=>a.payDate.localeCompare(b.payDate));
  if(!list.length)return toast('この月の明細がありません');
  const rows=[['支払日','取引先','勘定科目','登録番号','対象月','請求額(税込)','税率','うち消費税','請求書区分','メモ']];
  list.forEach(i=>{const v=vendor(i.vendorId)||{};rows.push([i.payDate,v.name,i.account,v.tno||'',i.targetYM,i.amount,rateLabel(i.rate),taxOf(i),i.rate==='0'?'':(autoKubun(i)==='tekikaku'?'適格':'区分記載'),i.memo]);});
  rows.push(['合計','','','','',sum(list),'',list.reduce((s,i)=>s+taxOf(i),0),'','']);
  const byA={};list.forEach(i=>byA[i.account]=(byA[i.account]||0)+i.amount);
  rows.push([]);rows.push(['科目別合計']);Object.entries(byA).forEach(([a,v])=>rows.push([a,v]));
  download(`支払一覧_${m}.csv`,new Blob([toSJIS(rows.map(r=>r.map(q).join(',')).join('\r\n')+'\r\n')],{type:'text/csv'}));
}

/* ===== OneDrive同期（売上・入金アプリと同じ設定） ===== */
const Sync=(()=>{
  const CLIENT_ID='7806d507-6cf4-49ad-b426-30b64e18879c',SC=['Files.ReadWrite.AppFolder'];
  const URL_F='https://graph.microsoft.com/v1.0/me/drive/special/approot:/shiharai.json:/content';
  let pca=null,timer=null,busy=false,again=false,ready=false;
  const S={state:'',err:''};
  const show=m=>{S.state=m;const b=$('#syncBtn');if(b){b.hidden=!S.account();b.textContent='☁ '+m;}};
  S.account=()=>{try{return pca&&(pca.getActiveAccount()||pca.getAllAccounts()[0])||null}catch(e){return null}};
  async function token(){
    try{return (await pca.acquireTokenSilent({scopes:SC,account:S.account()})).accessToken;}
    catch(e){pca.acquireTokenRedirect({scopes:SC});return new Promise(()=>{});}
  }
  async function gr(method,body){const t=await token();const h={Authorization:'Bearer '+t};if(body)h['Content-Type']='application/json';return fetch(URL_F,{method,headers:h,body});}
  async function getRemote(){const r=await gr('GET');if(r.status===404)return null;if(!r.ok)throw new Error('読込 '+r.status);return r.json();}
  function mergeList(a,b,del){
    const m=new Map();
    [...a,...b].forEach(x=>{const c=m.get(x.id);if(!c||(x.updatedAt||0)>(c.updatedAt||0))m.set(x.id,x);});
    return [...m.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.updatedAt||0)));
  }
  function merge(L,R){
    if(!R||!Array.isArray(R.invoices))return L;
    const del=Object.assign({},R.deleted||{});Object.entries(L.deleted||{}).forEach(([k,v])=>{if(!del[k]||v>del[k])del[k]=v;});
    const useR=(R.settingsAt||0)>(L.settingsAt||0);
    return migrate({vendors:mergeList(L.vendors,R.vendors||[],del),invoices:mergeList(L.invoices,R.invoices||[],del),
      settings:useR?R.settings:L.settings,settingsAt:Math.max(L.settingsAt||0,R.settingsAt||0),deleted:del});
  }
  function apply(m){const before=JSON.stringify(D);D=m;persist();if(JSON.stringify(D)!==before){if(!sheetOpen())render();return true;}return false;}
  async function put(){const r=await gr('PUT',JSON.stringify(D));if(!r.ok)throw new Error('保存 '+r.status);}
  S.pull=async(force,push)=>{
    if(!ready||!S.account()){if(force)S.login();return;}
    if(busy){again=true;return;}
    busy=true;if(force)show('同期中…');
    try{const r=await getRemote();const changed=apply(merge(D,r));if(push||!r)await put();S.err='';show('同期済み');
      if(force)toast(changed?'新しい内容を読み込みました':'最新の状態です');}
    catch(e){show('オフライン');}
    busy=false;if(again){again=false;S.later();}
  };
  S.later=()=>{if(!ready||!S.account())return;clearTimeout(timer);show('同期待ち…');timer=setTimeout(async()=>{
    if(busy){again=true;return;}busy=true;show('同期中…');
    try{const r=await getRemote();apply(merge(D,r));await put();S.err='';show('同期済み');}
    catch(e){show('同期失敗：再試行します');setTimeout(S.later,8000);}
    busy=false;if(again){again=false;S.later();}
  },1200);};
  S.login=()=>{if(!pca){alert('Microsoftのログイン部品を読み込めませんでした。通信を確認してもう一度開いてください。');return;}pca.loginRedirect({scopes:SC});};
  S.init=async()=>{
    if(!window.msal)return;
    try{
      pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/consumers',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
      await pca.initialize();const r=await pca.handleRedirectPromise();
      const a=(r&&r.account)||pca.getAllAccounts()[0];
      if(a){pca.setActiveAccount(a);ready=true;show('確認中…');await S.pull(false,false);
        if(r&&r.account)S.later();
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)S.pull(false)});
        setInterval(()=>{if(!document.hidden&&!sheetOpen())S.pull(false)},30000);
        render();}
    }catch(e){S.err='ログインエラー：'+e.message;render();}
  };
  return S;
})();
$('#syncBtn').onclick=()=>Sync.pull(true,true);

document.addEventListener('gesturestart',e=>e.preventDefault());
$('#hdrAdd').onclick=()=>openInv(null);
render();
Sync.init();
</script>
